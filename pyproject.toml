[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hvvmap"
version = "0.1.0"
description = "HVV live transit data: GTI API fetcher and web map backend"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "redis",
]

[project.optional-dependencies]
fetcher = ["requests"]
gtfs-fetcher = ["redis"]
api = ["fastapi", "uvicorn"]
dev = ["pytest", "ruff", "httpx2"]

[project.scripts]
hvvmap-fetcher = "hvv_map.fetcher:main"
hvvmap-lines = "hvv_map.lines:main"
hvvmap-sublines-cache-update = "hvv_map.lines:update_sublines_cache_main"
hvvmap-stations = "hvv_map.stations:main"
hvvmap-fetch-announcements = "hvv_map.fetcher:fetch_once_announcements"
hvvmap-gtfs-fetcher = "hvv_map.gtfs_fetcher:main"
hvvmap-gtfs-fetch-once = "hvv_map.gtfs_fetcher:fetch_once"
hvvmap-departures = "hvv_map.departures:main"
hvvmap-departures-live = "hvv_map.departures_live:main"
hvvmap-trip-courses = "hvv_map.trip_courses:main"
hvvmap-course = "hvv_map.course_debug:main"
hvvmap-vehicle = "hvv_map.vehicle_history:main"
hvvmap-subline-check = "hvv_map.subline_debug:main"
hvvmap-plan-compare = "hvv_map.plan_debug:main"
hvvmap-trip-positions = "hvv_map.trip_positions:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hvv_map"]

[tool.ruff]
# line-length: default (88)

[tool.ruff.lint]
select = ["E", "W", "F"]  # match flake8's default scope

[tool.ruff.format]
quote-style = "double"  # like black
