<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>HVV Departures - Entwickleransicht</title>
    <style>
        :root {
            --ink: #1a2733;
            --muted: #5b6b78;
            --line: #d8dee3;
            --bg: #f4f6f8;
            --card: #ffffff;
            --accent: #1e64a0;
            --warn: #b3541e;
            --ok: #2b7a4b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
        }

        header {
            position: sticky;
            top: 0;
            z-index: 5;
            background: var(--card);
            border-bottom: 1px solid var(--line);
            padding: 12px 16px;
        }

        header h1 {
            margin: 0 0 2px;
            font-size: 1.05rem;
            font-weight: 600;
        }

        header .meta {
            font-size: 0.78rem;
            color: var(--muted);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            align-items: center;
            margin-top: 10px;
        }

        .toolbar input[type="search"] {
            flex: 1 1 220px;
            min-width: 160px;
            padding: 6px 10px;
            border: 1px solid var(--line);
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .toolbar label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
            color: var(--muted);
            white-space: nowrap;
        }

        .toolbar button {
            border: 1px solid var(--line);
            background: var(--card);
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--ink);
        }

        .toolbar button:hover {
            background: var(--bg);
        }

        .toolbar button.active {
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 600;
        }

        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 16px;
        }

        .count-line {
            font-size: 0.8rem;
            color: var(--muted);
            margin: 4px 0 12px;
        }

        .node {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--card);
            margin-bottom: 8px;
            overflow: hidden;
        }

        .node .node {
            margin: 6px 8px;
            border-radius: 6px;
        }

        .node-header {
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 8px 12px;
            cursor: pointer;
            user-select: none;
        }

        .node-header:hover {
            background: #fafbfc;
        }

        .disclosure {
            flex: 0 0 auto;
            width: 1em;
            color: var(--muted);
            transition: transform 0.15s ease;
        }

        .node.open>.node-header .disclosure {
            transform: rotate(90deg);
        }

        .node-title {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .node-sub {
            font-size: 0.75rem;
            color: var(--muted);
        }

        .badge {
            font-size: 0.7rem;
            padding: 1px 7px;
            border-radius: 999px;
            border: 1px solid var(--line);
            color: var(--muted);
            white-space: nowrap;
        }

        .badge.ok {
            border-color: var(--ok);
            color: var(--ok);
        }

        .badge.warn {
            border-color: var(--warn);
            color: var(--warn);
        }

        .node-body {
            display: none;
            border-top: 1px solid var(--line);
        }

        .node.open>.node-body {
            display: block;
        }

        table.rows {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        table.rows th,
        table.rows td {
            text-align: left;
            padding: 3px 10px;
            border-bottom: 1px solid var(--line);
        }

        table.rows th {
            color: var(--muted);
            font-weight: 500;
        }

        table.rows td.time {
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .next-day {
            color: var(--warn);
            font-size: 0.7rem;
        }

        .empty,
        .error {
            padding: 24px;
            text-align: center;
            color: var(--muted);
        }

        .error {
            color: var(--warn);
        }
    </style>
</head>

<body>
    <header>
        <h1>HVV Departures - Entwickleransicht</h1>
        <div class="meta" id="meta">lädt …</div>
        <div class="toolbar">
            <button id="view-station" class="active">Nach Station</button>
            <button id="view-trip">Nach Fahrt</button>
            <button id="view-live">Live (Echtzeit)</button>
            <input type="search" id="search" placeholder="Filter: Linie, Station, Richtung, Fahrt-ID …">
            <button id="expand-top">Linien aufklappen</button>
            <button id="collapse-all">Alle einklappen</button>
            <label id="only-unresolved-label" hidden><input type="checkbox" id="only-unresolved"> nur Fahrten ohne Subline</label>
        </div>
    </header>
    <main>
        <div class="count-line" id="count-line"></div>
        <div id="tree"></div>
    </main>

    <script>
        const ENDPOINTS = {
            station: '/api/hvv/live/departures-by-station.json',
            trip: '/api/hvv/live/departures-by-trip.json',
            live: '/api/hvv/live/departures-live.json',
        };
        const LIVE_MAX_AGE_MS = 30000;
        const loadedAt = {};
        const MODE_LABELS = {
            U: 'U-Bahn', S: 'S-Bahn', AKN: 'AKN', R: 'Regionalzüge',
            FERRY: 'Fähren', OTHER: 'Sonstige',
        };

        const datasets = {};   // view -> parsed response, loaded on first use
        const openPaths = {};  // node path -> true, survives re-renders
        let view = 'station';

        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        function badge(text, kind) {
            return el('span', 'badge' + (kind ? ' ' + kind : ''), text);
        }

        // One collapsible node; fillBody runs on first open only, so large
        // departure lists are never built until someone looks at them.
        function makeNode(path, title, sub, badges, fillBody, startOpen) {
            const node = el('div', 'node');
            const header = el('div', 'node-header');
            header.append(el('span', 'disclosure', '▸'), el('span', 'node-title', title));
            if (sub) header.append(el('span', 'node-sub', sub));
            badges.forEach(b => header.append(b));
            const body = el('div', 'node-body');
            node.append(header, body);

            let filled = false;
            function setOpen(open) {
                node.classList.toggle('open', open);
                if (open) openPaths[path] = true; else delete openPaths[path];
                if (open && !filled) {
                    filled = true;
                    fillBody(body);
                }
            }
            header.addEventListener('click', () => setOpen(!node.classList.contains('open')));
            if (startOpen || openPaths[path]) setOpen(true);
            return node;
        }

        function timeCell(item) {
            const cell = el('td', 'time', item.time || ('+' + item.offset + ' min'));
            if (item.next_day) cell.append(' ', el('span', 'next-day', 'Folgetag'));
            return cell;
        }

        function table(headers, rows) {
            const t = el('table', 'rows');
            const head = el('tr');
            headers.forEach(h => head.append(el('th', '', h)));
            t.append(head);
            rows.forEach(cells => {
                const tr = el('tr');
                cells.forEach(c => tr.append(c instanceof Node ? c : el('td', '', c ?? '')));
                t.append(tr);
            });
            return t;
        }

        function matches(query, ...texts) {
            return !query || texts.some(t => String(t ?? '').toLowerCase().includes(query));
        }

        // --- station view: mode -> line -> station -> departures -------------
        function renderStationView(data, query) {
            const root = el('div');
            let shownDepartures = 0;
            data.modes.forEach(mode => {
                const lineNodes = [];
                mode.lines.forEach(line => {
                    const lineHit = matches(query, line.name, line.id);
                    const stations = line.stations
                        .map(st => {
                            const stHit = lineHit || matches(query, st.name);
                            const deps = st.departures.filter(d =>
                                stHit || matches(query, d.direction, d.service_id, d.vehicles, d.model));
                            return deps.length ? { ...st, departures: deps } : null;
                        })
                        .filter(Boolean);
                    if (!stations.length) return;
                    const count = stations.reduce((n, s) => n + s.departures.length, 0);
                    shownDepartures += count;
                    const path = `s/${mode.mode}/${line.name}/${line.id}`;
                    lineNodes.push(makeNode(path, line.name, line.id,
                        [badge(`${stations.length} Stationen`), badge(`${count} Abfahrten`)],
                        body => stations.forEach(st => body.append(stationNode(path, st)))));
                });
                if (!lineNodes.length) return;
                const path = `s/${mode.mode}`;
                root.append(makeNode(path, MODE_LABELS[mode.mode] || mode.mode, '',
                    [badge(`${lineNodes.length} Linien`)],
                    body => lineNodes.forEach(n => body.append(n)), !!query));
            });
            return { root, summary: `${shownDepartures} Abfahrten` };
        }

        function delayCell(seconds) {
            if (seconds === null || seconds === undefined) return '–';
            return seconds ? `+${Math.round(seconds / 60)} min` : 'pünktlich';
        }

        function stationNode(parentPath, st) {
            return makeNode(`${parentPath}/${st.id}`, st.name, '',
                [badge(`${st.departures.length} Abfahrten`)],
                body => body.append(table(
                    ['Zeit', 'Verspätung', 'Richtung', 'Gleis', 'Fahrt', 'Rtg-ID', 'Modell', 'Fahrzeug'],
                    st.departures.map(d => [timeCell(d), delayCell(d.delay), d.direction, d.platform,
                        d.service_id, d.direction_id, d.model, d.vehicles]))));
        }

        // --- trip view: mode -> line -> trip -> stops ------------------------
        function renderTripView(data, query) {
            const onlyUnresolved = document.getElementById('only-unresolved').checked;
            const root = el('div');
            let shownTrips = 0;
            data.modes.forEach(mode => {
                const lineNodes = [];
                mode.lines.forEach(line => {
                    const lineHit = matches(query, line.name, line.id);
                    const trips = line.trips.filter(t =>
                        (!onlyUnresolved || t.subline_stop_count === null) &&
                        (lineHit || matches(query, t.service_id, t.origin, t.destination,
                            ...t.stops.map(s => s.name),
                            ...t.stops.map(s => s.vehicles))));
                    if (!trips.length) return;
                    shownTrips += trips.length;
                    const resolved = trips.filter(t => t.subline_stop_count !== null).length;
                    const path = `t/${mode.mode}/${line.name}/${line.id}`;
                    lineNodes.push(makeNode(path, line.name, line.id,
                        [badge(`${trips.length} Fahrten`),
                         badge(`${resolved} mit Subline`, resolved === trips.length ? 'ok' : 'warn')],
                        body => trips.forEach(t => body.append(tripNode(path, t)))));
                });
                if (!lineNodes.length) return;
                root.append(makeNode(`t/${mode.mode}`, MODE_LABELS[mode.mode] || mode.mode, '',
                    [badge(`${lineNodes.length} Linien`)],
                    body => lineNodes.forEach(n => body.append(n)), !!query));
            });
            return { root, summary: `${shownTrips} Fahrten` };
        }

        function tripNode(parentPath, trip) {
            const first = trip.stops[0];
            const when = first ? (first.time || ('+' + first.offset)) : '–';
            const resolved = trip.subline_stop_count !== null;
            return makeNode(`${parentPath}/${trip.service_id}`,
                `${when}  ${trip.origin || '?'} → ${trip.destination || '?'}`,
                `Fahrt ${trip.service_id}`,
                [badge(`${trip.stop_count} Halte`),
                 ...(trip.model ? [badge(trip.model)] : []),
                 badge(resolved ? `Subline: ${trip.subline_stop_count} Halte` : 'keine Subline',
                    resolved ? 'ok' : 'warn')],
                body => body.append(table(
                    ['Zeit', 'Station', 'Gleis', 'Fahrzeug'],
                    trip.stops.map(s => [timeCell(s), s.name, s.platform, s.vehicles]))));
        }

        // --- page plumbing -----------------------------------------------------
        async function load(which) {
            const stale = which === 'live' && Date.now() - (loadedAt.live || 0) > LIVE_MAX_AGE_MS;
            if (datasets[which] && !stale) return datasets[which];
            const response = await fetch(ENDPOINTS[which]);
            if (!response.ok) {
                throw new Error(`${response.status}: ${(await response.json()).detail || response.statusText}`);
            }
            datasets[which] = await response.json();
            loadedAt[which] = Date.now();
            return datasets[which];
        }

        async function render() {
            const tree = document.getElementById('tree');
            try {
                const data = await load(view);
                const query = document.getElementById('search').value.trim().toLowerCase();
                const { root, summary } = view === 'trip'
                    ? renderTripView(data, query) : renderStationView(data, query);
                tree.replaceChildren(root.childNodes.length ? root : el('div', 'empty', 'Keine Treffer.'));
                document.getElementById('count-line').textContent = summary;
                document.getElementById('meta').textContent =
                    'Cache-Stand: ' + (data.fetched_at ? new Date(data.fetched_at * 1000).toLocaleString('de-DE') : '–')
                    + ' · Zeiten ab Anker ' + (data.anchor || '– (ohne Uhrzeit)');
            } catch (error) {
                tree.replaceChildren(el('div', 'error', 'Fehler beim Laden: ' + error.message));
            }
        }

        function setView(next) {
            view = next;
            document.getElementById('view-station').classList.toggle('active', next === 'station');
            document.getElementById('view-trip').classList.toggle('active', next === 'trip');
            document.getElementById('view-live').classList.toggle('active', next === 'live');
            document.getElementById('only-unresolved-label').hidden = next !== 'trip';
            render();
        }

        document.getElementById('view-station').addEventListener('click', () => setView('station'));
        document.getElementById('view-trip').addEventListener('click', () => setView('trip'));
        document.getElementById('view-live').addEventListener('click', () => setView('live'));
        document.getElementById('only-unresolved').addEventListener('change', render);
        document.getElementById('search').addEventListener('input', render);
        document.getElementById('collapse-all').addEventListener('click', () => {
            Object.keys(openPaths).forEach(k => delete openPaths[k]);
            render();
        });
        document.getElementById('expand-top').addEventListener('click', () => {
            // Modes plus their lines only - station/trip levels stay closed.
            document.querySelectorAll('#tree > div > .node').forEach(node => {
                if (!node.classList.contains('open')) node.querySelector('.node-header').click();
                node.querySelectorAll(':scope > .node-body > .node').forEach(child => {
                    if (!child.classList.contains('open')) child.querySelector('.node-header').click();
                });
            });
        });
        render();
    </script>
</body>

</html>
