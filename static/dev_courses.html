<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>HVV departureCourse-Abrufe - Entwickleransicht</title>
    <style>
        :root {
            --ink: #1a2733;
            --muted: #5b6b78;
            --line: #d8dee3;
            --bg: #f4f6f8;
            --card: #ffffff;
            --accent: #1e64a0;
            --warn: #b3541e;
            --ok: #2b7a4b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
            font-size: 0.88rem;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 5;
            background: var(--card);
            border-bottom: 1px solid var(--line);
            padding: 12px 16px;
        }

        h1 {
            margin: 0 0 2px;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .meta {
            font-size: 0.78rem;
            color: var(--muted);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            align-items: center;
            margin-top: 10px;
        }

        .toolbar input[type="search"],
        .toolbar select {
            padding: 6px 8px;
            border: 1px solid var(--line);
            border-radius: 6px;
            font: inherit;
        }

        .toolbar input[type="search"] {
            flex: 1 1 220px;
        }

        .tabs button {
            padding: 6px 12px;
            border: 1px solid var(--line);
            background: var(--bg);
            font: inherit;
            cursor: pointer;
        }

        .tabs button:first-child {
            border-radius: 6px 0 0 6px;
        }

        .tabs button:last-child {
            border-radius: 0 6px 6px 0;
        }

        .tabs button.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        main {
            padding: 12px 16px 40px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);
            border: 1px solid var(--line);
        }

        th,
        td {
            text-align: left;
            padding: 6px 10px;
            border-bottom: 1px solid var(--line);
            white-space: nowrap;
        }

        th {
            background: #eef2f5;
            font-weight: 600;
            font-size: 0.78rem;
            position: sticky;
            top: 0;
        }

        td.num,
        th.num {
            text-align: right;
        }

        tr.call {
            cursor: pointer;
        }

        tr.call:hover {
            background: #f0f5fa;
        }

        tr.detail td {
            white-space: normal;
            background: #fafbfc;
            color: var(--muted);
            font-size: 0.8rem;
        }

        .ok {
            color: var(--ok);
            font-weight: 600;
        }

        .bad {
            color: var(--warn);
            font-weight: 600;
        }

        .empty {
            padding: 24px;
            color: var(--muted);
        }

        .muted {
            color: var(--muted);
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }

        .stat {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 8px 12px;
            min-width: 150px;
        }

        .stat b {
            display: block;
            font-size: 1.15rem;
        }

        .stat span {
            color: var(--muted);
            font-size: 0.78rem;
        }

        h2 {
            font-size: 0.95rem;
            margin: 18px 0 8px;
        }

        h2:first-child {
            margin-top: 0;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
    <header>
        <h1>departureCourse-Abrufe</h1>
        <div class="meta" id="meta">lädt …</div>
        <div class="toolbar">
            <span class="tabs">
                <button data-view="overview" class="active">Übersicht</button>
                <button data-view="log">Abrufe</button>
                <button data-view="calls">Strecken-Historie</button>
                <button data-view="runs">Strecken-Läufe</button>
            </span>
            <input type="search" id="search" placeholder="Linie, Station, ID …">
            <select id="kind" data-for="log">
                <option value="">alle Arten</option>
                <option value="trip">Fahrten</option>
                <option value="track">Strecken</option>
                <option value="manual">manuell</option>
            </select>
            <select id="reason" data-for="log">
                <option value="">alle Gründe</option>
            </select>
            <select id="result" data-for="log calls">
                <option value="">alle Ergebnisse</option>
                <option value="ok">nur ok</option>
                <option value="bad">nur Fehler</option>
                <option value="vehicle">nur mit Fahrzeug</option>
            </select>
        </div>
    </header>
    <main id="content"></main>

    <script>
        const ENDPOINT = "/api/hvv/gtilive/courses.json?limit=2000";
        const URL_LOG = "/api/hvv/live/course-log.json";
        const URL_CACHE = "/api/hvv/live/course-cache.json";
        const REFRESH_MS = 60000;
        const TRIP_CALLS_PER_10_MIN = 150;  // trip_courses: 30 calls every 2 min
        let data = { calls: [], runs: [] };   // subline track history (SQLite)
        let log = [];                         // all departureCourse calls (Redis)
        let cache = null;                     // trip course cache summary
        let view = "overview";
        let historyLoaded = false;

        const KIND_LABELS = { trip: "Fahrt", track: "Strecke", manual: "manuell" };
        const REASON_LABELS = {
            new: "neu", other_run: "anderer Lauf", retry: "Wiederholung",
            station: "Station fehlt", between: "zwischen Ankern", regional: "Regionalzug",
            delayed: "verspätet", age: "Alter", "new subline": "neue Subline",
            "missing hops": "fehlende Abschnitte", variant: "Variante",
        };
        const MODE_LABELS = {
            U: "U-Bahn", S: "S-Bahn", AKN: "AKN", R: "Regionalzüge", FERRY: "Fähren",
        };

        const content = document.getElementById("content");
        const search = document.getElementById("search");
        const resultFilter = document.getElementById("result");
        const kindFilter = document.getElementById("kind");
        const reasonFilter = document.getElementById("reason");

        const minutes = seconds => seconds === null || seconds === undefined
            ? "–" : (seconds / 60).toFixed(1).replace(".", ",") + " min";
        const percent = (part, whole) => whole ? Math.round(100 * part / whole) + " %" : "–";

        function stat(value, label) {
            const box = document.createElement("div");
            box.className = "stat";
            const b = document.createElement("b");
            b.textContent = value;
            const span = document.createElement("span");
            span.textContent = label;
            box.append(b, span);
            return box;
        }

        function heading(text) {
            const h = document.createElement("h2");
            h.textContent = text;
            return h;
        }

        function stamp(seconds) {
            return seconds
                ? new Date(seconds * 1000).toLocaleString("de-DE", {
                    day: "2-digit", month: "2-digit", hour: "2-digit",
                    minute: "2-digit", second: "2-digit",
                })
                : "–";
        }

        function delayText(seconds) {
            if (seconds === null || seconds === undefined) return "–";
            return `${Math.round(seconds / 60)} min`;
        }

        function cell(row, text, cls) {
            const td = document.createElement("td");
            td.textContent = text;
            if (cls) td.className = cls;
            row.appendChild(td);
            return td;
        }

        function table(headers, numeric) {
            const t = document.createElement("table");
            const head = document.createElement("tr");
            headers.forEach((h, i) => {
                const th = document.createElement("th");
                th.textContent = h;
                if (numeric.includes(i)) th.className = "num";
                head.appendChild(th);
            });
            t.appendChild(head);
            return t;
        }

        function matches(text) {
            const q = search.value.trim().toLowerCase();
            return !q || text.toLowerCase().includes(q);
        }

        function resultMatches(call) {
            const f = resultFilter.value;
            if (f === "vehicle") return vehicleInfo(call).length > 0;
            return !f || (f === "ok") === (call.result === "ok");
        }

        function clock(iso) {
            return iso ? iso.slice(11, 19) : "–";
        }

        const VEHICLE_KEY = /vehicle|fahrzeug|train|wagen|nummer|number|fleet|model/i;

        function flatten(value, path, out) {
            if (value && typeof value === "object") {
                for (const [k, v] of Object.entries(value)) {
                    flatten(v, path ? `${path}.${k}` : k, out);
                }
            } else if (value !== null && value !== "") {
                out.push([path, value]);
            }
            return out;
        }

        // Hamburg U-Bahn fleet; keep in sync with UBAHN_SERIES in departures_tree.py
        const UBAHN_SERIES = [
            [101, 130, "DT4.1"], [131, 151, "DT4.2"], [152, 171, "DT4.3"],
            [172, 186, "DT4.4"], [187, 211, "DT4.5"], [212, 226, "DT4.6"],
            [301, 418, "DT5.1"], [419, 463, "DT5.2"],
        ];

        function ubahnSeries(number) {
            const n = parseInt(number, 10);
            const hit = UBAHN_SERIES.find(([first, last]) => n >= first && n <= last);
            return hit ? hit[2] : null;
        }

        const isUbahn = call => /^U\d+$/.test(call.line || "");

        // vehicle numbers with the U-Bahn series, e.g. "DT5.1 (355)"
        function vehicleNumbers(call) {
            return ((call.meta && call.meta.vehicles) || []).map(v => {
                const series = isUbahn(call) ? ubahnSeries(v.number) : null;
                return (series ? `${series} (${v.number})` : v.number) || v.id;
            }).filter(Boolean);
        }

        // type from the U-Bahn numbers (DT4/DT5), else the model the API sends
        function modelOf(call, apiModel) {
            if (isUbahn(call)) {
                const types = new Set(((call.meta && call.meta.vehicles) || [])
                    .map(v => ubahnSeries(v.number)).filter(Boolean).map(x => x.slice(0, 3)));
                if (types.size) return [...types].sort().join("/");
            }
            return apiModel;
        }

        // vehicle numbers plus other vehicle-like response fields (model is derived)
        function vehicleInfo(call) {
            const found = new Set(vehicleNumbers(call));
            const sources = [call.meta, ...(call.legs || []).map(l => l.extra)];
            for (const source of sources) {
                for (const [path, value] of flatten(source, "", [])) {
                    const key = path.split(".").pop();
                    if (path.startsWith("vehicles.") || key === "model" || key === "id") continue;
                    if (VEHICLE_KEY.test(path)) found.add(`${key}: ${value}`);
                }
            }
            return [...found].filter(Boolean);
        }

        // every field beyond the known ones, to spot what the API really sends
        function extraFields(call) {
            const extra = {};
            if (call.meta && Object.keys(call.meta).length) extra.antwort = call.meta;
            const legs = (call.legs || []).map(l => l.extra).filter(e => e && Object.keys(e).length);
            if (legs.length) extra.streckenelemente = legs;
            return Object.keys(extra).length ? JSON.stringify(extra, null, 2) : "";
        }

        // planned time, plus the delayed time when the API reports a delay
        function timeWithDelay(iso, delay) {
            if (!iso) return "–";
            if (!delay) return clock(iso);
            const actual = new Date(new Date(iso).getTime() + delay * 1000);
            return `${clock(iso)} → ${actual.toLocaleTimeString("de-DE")} (+${Math.round(delay / 60)} min)`;
        }

        // one row per station: arrival from the previous leg, departure from this one
        function legTable(call) {
            const legs = call.legs || [];
            if (!legs.length) {
                const note = document.createElement("div");
                note.textContent = "keine Streckenelemente in der Antwort";
                return note;
            }
            const t = table(["Halt", "Ankunft", "Abfahrt", "Modell"], []);
            const stops = legs.map((leg, i) => ({
                name: leg.from,
                arr: i ? [legs[i - 1].arr_time, legs[i - 1].arr_delay] : [null, null],
                dep: [leg.dep_time, leg.dep_delay],
                model: modelOf(call, (leg.extra || {}).model),
            }));
            const last = legs[legs.length - 1];
            stops.push({ name: last.to, arr: [last.arr_time, last.arr_delay], dep: [null, null] });
            for (const stop of stops) {
                const row = document.createElement("tr");
                cell(row, stop.name || "–");
                cell(row, timeWithDelay(...stop.arr));
                cell(row, timeWithDelay(...stop.dep));
                cell(row, stop.model || "–");
                t.appendChild(row);
            }
            const box = document.createElement("div");
            const vehicle = vehicleInfo(call);
            if (vehicle.length) {
                const line = document.createElement("div");
                line.textContent = `Fahrzeug: ${vehicle.join(" · ")}`;
                box.appendChild(line);
            }
            box.appendChild(t);
            const raw = extraFields(call);
            if (raw) {
                const details = document.createElement("details");
                const summary = document.createElement("summary");
                summary.textContent = "Weitere Felder der Antwort";
                const pre = document.createElement("pre");
                pre.textContent = raw;
                details.append(summary, pre);
                box.appendChild(details);
            }
            return box;
        }

        function renderCalls() {
            const t = table(
                ["Zeit", "Lauf", "Linie", "Fahrt", "Station", "Abfahrt", "Ergebnis",
                    "Segmente", "max. Verspätung", "Fahrzeug"], [7]);
            let shown = 0;
            for (const c of data.calls) {
                const text = [c.line, c.station, c.service_id, ...vehicleInfo(c)].join(" ");
                if (!matches(text) || !resultMatches(c)) continue;
                shown++;
                const row = document.createElement("tr");
                row.className = "call";
                cell(row, stamp(c.called_at));
                cell(row, stamp(c.run_id));
                cell(row, c.line);
                cell(row, c.service_id);
                cell(row, c.station || "–");
                cell(row, c.dep_time ? c.dep_time.slice(0, 16).replace("T", " ") : "–");
                cell(row, c.result, c.result === "ok" ? "ok" : "bad");
                cell(row, String(c.segments), "num");
                cell(row, delayText(c.max_delay_s), "num");
                cell(row, vehicleInfo(c).slice(0, 2).join(" · ") || "–");
                t.appendChild(row);

                const detail = document.createElement("tr");
                detail.className = "detail";
                detail.hidden = true;
                const td = document.createElement("td");
                td.colSpan = 10;
                td.appendChild(legTable(c));
                detail.appendChild(td);
                t.appendChild(detail);
                row.addEventListener("click", () => { detail.hidden = !detail.hidden; });
            }
            return [t, shown];
        }

        function renderRuns() {
            const t = table(["Lauf", "Abrufe", "ok", "Fehler", "von", "bis"], [1, 2, 3]);
            for (const r of data.runs) {
                const row = document.createElement("tr");
                cell(row, stamp(r.run_id));
                cell(row, String(r.calls), "num");
                cell(row, String(r.ok), "num ok");
                cell(row, String(r.calls - r.ok), r.calls - r.ok ? "num bad" : "num");
                cell(row, stamp(r.first));
                cell(row, stamp(r.last));
                t.appendChild(row);
            }
            return [t, data.runs.length];
        }

        // Calls of the last `seconds` from the Redis log.
        const recent = seconds => log.filter(c => c.at >= Date.now() / 1000 - seconds);

        function renderOverview() {
            const box = document.createElement("div");
            if (cache) {
                const t = cache.total;
                box.append(heading("Course-Bestand der Fahrten (Live-serviceIds)"));
                const stats = document.createElement("div");
                stats.className = "stats";
                stats.append(
                    stat(t.live, "Live-serviceIds"),
                    stat(`${t.ok} (${percent(t.ok, t.live)})`, "mit Course"),
                    stat(t.missing, "ohne Course"),
                    stat(t.failed, "fehlgeschlagen"),
                    stat(t.stale, `älter als ${cache.refresh_seconds / 60} min`),
                    stat(`${minutes(t.age.median)} / ${minutes(t.age.p90)}`, "Alter Median / 90 %"),
                    stat(`${cache.between.count} · ${minutes(cache.between.age.median)}`,
                        "zwischen Ankern · Alter Median"),
                );
                box.append(stats);
            }
            const hour = recent(3600);
            const trips = hour.filter(c => c.kind === "trip");
            const tenMinutes = recent(600).filter(c => c.kind === "trip").length;
            box.append(heading("Abrufe der letzten Stunde"));
            const calls = document.createElement("div");
            calls.className = "stats";
            const failed = hour.filter(c => c.result !== "ok").length;
            const ms = hour.map(c => c.ms).filter(x => x != null);
            calls.append(
                stat(trips.length, "Fahrten"),
                stat(hour.filter(c => c.kind === "track").length, "Strecken"),
                stat(hour.filter(c => c.kind === "manual").length, "manuell"),
                stat(`${failed} (${percent(failed, hour.length)})`, "Fehler"),
                stat(`${tenMinutes} / ${TRIP_CALLS_PER_10_MIN}`, "Fahrten-Budget, 10 min"),
                stat(ms.length ? Math.round(ms.reduce((a, b) => a + b, 0) / ms.length) + " ms" : "–",
                    "Antwortzeit Mittel"),
            );
            box.append(calls);
            const reasons = {};
            for (const c of trips) reasons[c.reason] = (reasons[c.reason] || 0) + 1;
            const changed = trips.filter(c => c.delay_change !== null && c.delay_change !== undefined);
            const moved = changed.filter(c => c.delay_change >= 120).length;
            const reasonLine = document.createElement("div");
            reasonLine.className = "muted";
            reasonLine.textContent = "Gründe: " + (Object.entries(reasons)
                .sort((a, b) => b[1] - a[1])
                .map(([r, n]) => `${REASON_LABELS[r] || r} ${n}`).join(" · ") || "–") +
                ` · Verspätung um ≥ 2 min geändert: ${moved} von ${changed.length} erneuten Abrufen`;
            box.append(reasonLine);

            if (cache) {
                box.append(heading("Je Linie"));
                const t = table(["Linie", "Verkehrsmittel", "Live-IDs", "mit Course", "ohne",
                    "fehlgeschl.", "veraltet", "Alter Median", "90 %", "max"], [2, 3, 4, 5, 6, 7, 8, 9]);
                for (const row of cache.lines) {
                    const tr = document.createElement("tr");
                    cell(tr, row.line);
                    cell(tr, MODE_LABELS[row.mode] || row.mode);
                    cell(tr, String(row.live), "num");
                    cell(tr, String(row.ok), "num");
                    cell(tr, String(row.missing), row.missing ? "num bad" : "num");
                    cell(tr, String(row.failed), row.failed ? "num bad" : "num");
                    cell(tr, String(row.stale), "num");
                    cell(tr, minutes(row.age.median), "num");
                    cell(tr, minutes(row.age.p90), "num");
                    cell(tr, minutes(row.age.max), "num");
                    t.appendChild(tr);
                }
                box.append(t);
            }
            return [box, 1];
        }

        function renderLog() {
            const t = table(["Zeit", "Art", "Grund", "Linie", "serviceId", "Station",
                "angefragt", "Ergebnis", "Halte", "Verspätung Δ", "Dauer"], [8, 9, 10]);
            let shown = 0;
            for (const c of log) {
                if (kindFilter.value && c.kind !== kindFilter.value) continue;
                if (reasonFilter.value && c.reason !== reasonFilter.value) continue;
                const f = resultFilter.value;
                if (f && f !== "vehicle" && (f === "ok") !== (c.result === "ok")) continue;
                if (!matches([c.line, c.station, c.service_id].join(" "))) continue;
                if (++shown > 1000) break;
                const row = document.createElement("tr");
                cell(row, stamp(c.at));
                cell(row, KIND_LABELS[c.kind] || c.kind);
                cell(row, REASON_LABELS[c.reason] || c.reason || "–");
                cell(row, c.line || "–");
                cell(row, c.service_id);
                cell(row, c.station || "–");
                cell(row, c.time ? c.time.slice(11, 16) : "–");
                cell(row, c.result, c.result === "ok" ? "ok" : "bad");
                cell(row, String(c.stops), "num");
                cell(row, c.delay_change === null || c.delay_change === undefined
                    ? "–" : minutes(c.delay_change), "num");
                cell(row, c.ms + " ms", "num");
                t.appendChild(row);
            }
            return [t, shown];
        }

        function fillReasons() {
            const present = [...new Set(log.map(c => c.reason).filter(Boolean))].sort();
            const previous = reasonFilter.value;
            reasonFilter.replaceChildren(new Option("alle Gründe", ""),
                ...present.map(r => new Option(REASON_LABELS[r] || r, r)));
            if (present.includes(previous)) reasonFilter.value = previous;
        }

        function render() {
            for (const control of document.querySelectorAll("[data-for]")) {
                control.hidden = !control.dataset.for.split(" ").includes(view);
            }
            search.hidden = view === "overview" || view === "runs";
            const renderers = { overview: renderOverview, log: renderLog, calls: renderCalls, runs: renderRuns };
            const [node, shown] = renderers[view]();
            content.replaceChildren(shown ? node : Object.assign(
                document.createElement("div"), { className: "empty", textContent: "Keine Einträge." }));
        }

        function renderMeta() {
            const oldest = log.length ? stamp(log[log.length - 1].at) : "–";
            const parts = [`${log.length} Abrufe im Protokoll seit ${oldest}`];
            if (cache?.live_fetched_at) parts.push(`Live-Stand ${stamp(cache.live_fetched_at)}`);
            if (historyLoaded) parts.push(`Strecken-Historie: ${data.calls.length} Abrufe, ${data.runs.length} Läufe`);
            document.getElementById("meta").textContent = parts.join(" · ");
        }

        async function loadJson(url) {
            const response = await fetch(url, { cache: "no-store" });
            if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
            return response.json();
        }

        async function refresh() {
            try {
                const [logData, cacheData] = await Promise.all([loadJson(URL_LOG), loadJson(URL_CACHE)]);
                log = logData.calls;
                cache = cacheData;
                fillReasons();
                renderMeta();
            } catch (error) {
                document.getElementById("meta").textContent = `Fehler beim Laden: ${error.message}`;
            }
            if (view === "overview" || view === "log") render();
        }

        async function loadHistory() {
            if (historyLoaded) return;
            try {
                data = await loadJson(ENDPOINT);
                historyLoaded = true;
                renderMeta();
            } catch (error) {
                document.getElementById("meta").textContent = `Fehler beim Laden: ${error.message}`;
            }
        }

        document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", async () => {
            view = b.dataset.view;
            document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("active", x === b));
            if (view === "calls" || view === "runs") await loadHistory();
            render();
        }));
        search.addEventListener("input", render);
        resultFilter.addEventListener("change", render);
        kindFilter.addEventListener("change", render);
        reasonFilter.addEventListener("change", render);

        render();
        refresh();
        setInterval(refresh, REFRESH_MS);
    </script>
</body>

</html>
