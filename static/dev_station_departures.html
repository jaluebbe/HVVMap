<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>HVV Abfahrten - Plan gegen Live</title>
    <style>
        :root {
            --ink: #1a2733;
            --muted: #5b6b78;
            --line: #d8dee3;
            --bg: #f4f6f8;
            --card: #ffffff;
            --accent: #1e64a0;
            --warn: #b3541e;
            --ok: #2b7a4b;
            --late: #b3261e;
            --dim: #98a4ad;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
        }

        header {
            position: sticky;
            top: 0;
            z-index: 5;
            background: var(--card);
            border-bottom: 1px solid var(--line);
            padding: 12px 16px;
        }

        header h1 {
            margin: 0 0 2px;
            font-size: 1.05rem;
            font-weight: 600;
        }

        header .meta {
            font-size: 0.78rem;
            color: var(--muted);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            align-items: end;
            margin-top: 10px;
        }

        .toolbar label {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 0.72rem;
            color: var(--muted);
        }

        .toolbar select,
        .toolbar input {
            min-width: 130px;
            padding: 6px 8px;
            border: 1px solid var(--line);
            border-radius: 6px;
            font-size: 0.85rem;
            background: var(--card);
            color: var(--ink);
        }

        .toolbar select#station {
            min-width: 220px;
        }

        main {
            padding: 12px 16px 32px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .count-line {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .table-wrap {
            overflow-x: auto;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            font-variant-numeric: tabular-nums;
        }

        th,
        td {
            padding: 6px 10px;
            text-align: left;
            border-bottom: 1px solid var(--line);
            white-space: nowrap;
        }

        th {
            position: sticky;
            top: 0;
            background: #eef2f5;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        th.group {
            text-align: center;
            border-left: 1px solid var(--line);
        }

        td.live-start,
        th.live-start {
            border-left: 1px solid var(--line);
        }

        tr:last-child td {
            border-bottom: 0;
        }

        tr.past td {
            color: var(--dim);
        }

        .time {
            font-weight: 600;
        }

        .delay {
            font-weight: 600;
        }

        .delay.on-time {
            color: var(--ok);
        }

        .delay.late {
            color: var(--late);
        }

        .delay.early {
            color: var(--accent);
        }

        .muted {
            color: var(--dim);
        }

        .tag {
            display: inline-block;
            padding: 0 6px;
            border-radius: 8px;
            font-size: 0.7rem;
            background: #fbe9dc;
            color: var(--warn);
        }

        .changed {
            color: var(--warn);
            font-weight: 600;
        }

        .empty {
            padding: 24px;
            color: var(--muted);
            text-align: center;
        }

        @media (max-width: 600px) {
            th,
            td {
                padding: 5px 6px;
            }

            .toolbar select,
            .toolbar input {
                min-width: 0;
                width: 100%;
            }

            .toolbar label {
                flex: 1 1 44%;
            }

            .toolbar label.wide {
                flex-basis: 100%;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Abfahrten: Plan gegen Live</h1>
        <div class="meta" id="meta">Lade ...</div>
        <div class="toolbar">
            <label>Verkehrsträger
                <select id="mode"></select>
            </label>
            <label>Linie
                <select id="line"></select>
            </label>
            <label class="wide">Haltestelle
                <select id="station"></select>
            </label>
            <label>Zeitraum
                <select id="range">
                    <option value="60">1 Stunde</option>
                    <option value="120" selected>2 Stunden</option>
                    <option value="360">6 Stunden</option>
                    <option value="1440">Ganzer Tag</option>
                </select>
            </label>
        </div>
    </header>
    <main>
        <div class="count-line" id="count-line"></div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th colspan="3">Plan</th>
                        <th colspan="4" class="group live-start">Live</th>
                    </tr>
                    <tr>
                        <th>Abfahrt</th>
                        <th>Richtung</th>
                        <th>Gleis</th>
                        <th class="live-start">Abfahrt</th>
                        <th>Verspätung</th>
                        <th>Gleis</th>
                        <th>Richtung</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </main>

    <script>
        const URL_PLAN = '/api/hvv/live/departures-by-station.json';
        const URL_LIVE = '/api/hvv/live/departures-live.json';
        const LIVE_REFRESH_MS = 30000;
        const PAST_MINUTES = 10; // departures this long ago stay visible
        const MODE_LABELS = {
            U: 'U-Bahn', S: 'S-Bahn', AKN: 'AKN', R: 'Regionalzüge',
            FERRY: 'Fähren', OTHER: 'Sonstige',
        };
        // Live data only covers a window after its anchor.
        const LIVE_WINDOW_MIN = { U: 5, S: 5, AKN: 5, FERRY: 5, R: 20, OTHER: 20 };

        let plan = null;
        let live = null;
        const sel = {
            mode: document.getElementById('mode'),
            line: document.getElementById('line'),
            station: document.getElementById('station'),
            range: document.getElementById('range'),
        };

        // "YYYY-MM-DD HH:MM" -> minutes on a common (zone-less) scale
        function anchorMinutes(text) {
            const m = /^(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)$/.exec(text || '');
            return m ? Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5]) / 60000 : null;
        }

        function berlinNowMinutes() {
            const parts = Object.fromEntries(
                new Intl.DateTimeFormat('en-GB', {
                    timeZone: 'Europe/Berlin', hourCycle: 'h23',
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit',
                }).formatToParts(new Date()).map(p => [p.type, p.value]));
            return Date.UTC(+parts.year, parts.month - 1, +parts.day,
                +parts.hour, +parts.minute) / 60000;
        }

        function clock(minutes) {
            const d = new Date(minutes * 60000);
            return String(d.getUTCHours()).padStart(2, '0') + ':' +
                String(d.getUTCMinutes()).padStart(2, '0');
        }

        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined && text !== null) node.textContent = text;
            return node;
        }

        function findNode(tree, modeKey, lineKey, stationId) {
            const mode = (tree?.modes || []).find(m => m.mode === modeKey);
            const line = mode?.lines.find(l => l.id === lineKey);
            return line?.stations.find(s => s.id === stationId) || null;
        }

        function fill(select, items, keep) {
            const previous = keep ?? select.value;
            select.replaceChildren(...items.map(([value, label]) => {
                const option = el('option', null, label);
                option.value = value;
                return option;
            }));
            if (items.some(([value]) => value === previous)) select.value = previous;
        }

        function fillModes() {
            fill(sel.mode, (plan?.modes || []).map(m => [m.mode, MODE_LABELS[m.mode] || m.mode]));
            fillLines();
        }

        function fillLines() {
            const mode = (plan?.modes || []).find(m => m.mode === sel.mode.value);
            fill(sel.line, (mode?.lines || []).map(l => [l.id, l.name]));
            fillStations();
        }

        function fillStations() {
            const mode = (plan?.modes || []).find(m => m.mode === sel.mode.value);
            const line = mode?.lines.find(l => l.id === sel.line.value);
            const stations = [...(line?.stations || [])]
                .sort((a, b) => a.name.localeCompare(b.name, 'de'));
            fill(sel.station, stations.map(s => [s.id, s.name]));
            render();
        }

        // Pair every plan departure with at most one live departure: same
        // planned minute and direction id first, then same minute, then one
        // minute off. Remaining live departures are shown on their own.
        function pair(planDeps, liveDeps) {
            const free = new Set(liveDeps.keys());
            const take = (p, tolerance, sameDirection) => {
                let best = null;
                for (const i of free) {
                    const l = liveDeps[i];
                    const gap = Math.abs(l.at - p.at);
                    if (gap > tolerance) continue;
                    if (sameDirection && l.direction_id !== p.direction_id) continue;
                    if (best === null || gap < Math.abs(liveDeps[best].at - p.at)) best = i;
                }
                if (best !== null) free.delete(best);
                return best;
            };
            const rows = planDeps.map(p => {
                let i = take(p, 0, true);
                if (i === null) i = take(p, 0, false);
                if (i === null) i = take(p, 1, true);
                return { plan: p, live: i === null ? null : liveDeps[i] };
            });
            for (const i of free) rows.push({ plan: null, live: liveDeps[i] });
            return rows.sort((a, b) => (a.plan?.at ?? a.live.at) - (b.plan?.at ?? b.live.at));
        }

        function delayCell(live) {
            const cell = el('td');
            if (!live || live.delay === null || live.delay === undefined) {
                cell.className = 'muted';
                cell.textContent = live ? 'keine Angabe' : '';
                return cell;
            }
            const minutes = Math.round(live.delay / 60);
            const kind = minutes > 0 ? 'late' : minutes < 0 ? 'early' : 'on-time';
            const span = el('span', 'delay ' + kind,
                minutes === 0 ? 'pünktlich' : (minutes > 0 ? '+' : '') + minutes + ' min');
            cell.append(span);
            return cell;
        }

        function render() {
            const body = document.getElementById('rows');
            const station = findNode(plan, sel.mode.value, sel.line.value, sel.station.value);
            const liveStation = findNode(live, sel.mode.value, sel.line.value, sel.station.value);
            const planAnchor = anchorMinutes(plan?.anchor);
            const liveAnchor = anchorMinutes(live?.anchor);
            body.replaceChildren();
            if (!station || planAnchor === null) {
                document.getElementById('count-line').textContent = '';
                return;
            }
            const now = berlinNowMinutes();
            const from = now - PAST_MINUTES;
            const to = now + Number(sel.range.value);
            const planDeps = station.departures
                .map(d => ({ ...d, at: planAnchor + d.offset }))
                .filter(d => d.at >= from && d.at <= to);
            const liveDeps = (liveStation?.departures || [])
                .map(d => ({ ...d, at: (liveAnchor ?? planAnchor) + d.offset }))
                .filter(d => d.at >= from && d.at <= to);
            const rows = pair(planDeps, liveDeps);
            const windowEnd = liveAnchor === null ? null
                : liveAnchor + (LIVE_WINDOW_MIN[sel.mode.value] ?? 20);

            for (const { plan: p, live: l } of rows) {
                const at = (p ?? l).at;
                const tr = el('tr', at < now ? 'past' : '');
                tr.append(el('td', 'time', p ? clock(p.at) : ''));
                tr.append(el('td', null, p ? p.direction : ''));
                tr.append(el('td', null, p ? p.platform || '' : ''));
                const liveTime = el('td', 'time live-start');
                if (l) {
                    liveTime.textContent = clock(l.at);
                    if (!p) liveTime.append(' ', el('span', 'tag', 'nur live'));
                } else if (p && windowEnd !== null && p.at > windowEnd) {
                    liveTime.className = 'muted live-start';
                    liveTime.textContent = 'außerhalb Livefenster';
                } else if (p && at >= now) {
                    liveTime.className = 'muted live-start';
                    liveTime.textContent = 'keine Live-Daten';
                } else {
                    liveTime.className = 'live-start';
                }
                tr.append(liveTime);
                tr.append(delayCell(l));
                const platform = el('td', l && p && l.platform && l.platform !== p.platform ? 'changed' : '',
                    l ? l.platform || '' : '');
                tr.append(platform);
                const direction = el('td', l && p && l.direction !== p.direction ? 'changed' : '',
                    l ? l.direction : '');
                tr.append(direction);
                body.append(tr);
            }
            if (!rows.length) {
                const tr = el('tr');
                const td = el('td', 'empty', 'Keine Abfahrten im gewählten Zeitraum.');
                td.colSpan = 7;
                tr.append(td);
                body.append(tr);
            }
            const matched = rows.filter(r => r.plan && r.live).length;
            document.getElementById('count-line').textContent =
                `${planDeps.length} Plan-Abfahrten, ${liveDeps.length} Live-Abfahrten, ` +
                `${matched} zugeordnet`;
        }

        function renderMeta() {
            const parts = [];
            if (plan) parts.push('Plan: Stand ' + new Date(plan.fetched_at * 1000).toLocaleTimeString('de-DE', { timeZone: 'Europe/Berlin' }));
            if (live) parts.push('Live: Stand ' + new Date(live.fetched_at * 1000).toLocaleTimeString('de-DE', { timeZone: 'Europe/Berlin' }));
            document.getElementById('meta').textContent = parts.join(' · ');
        }

        async function load(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(url + ': ' + response.status);
            return response.json();
        }

        async function refreshLive() {
            try {
                live = await load(URL_LIVE);
                renderMeta();
                render();
            } catch (error) {
                document.getElementById('meta').textContent = String(error);
            }
        }

        async function start() {
            try {
                [plan, live] = await Promise.all([load(URL_PLAN), load(URL_LIVE)]);
            } catch (error) {
                document.getElementById('meta').textContent = String(error);
                return;
            }
            renderMeta();
            const saved = new URLSearchParams(location.search);
            fillModes();
            for (const [key, select] of [['mode', sel.mode], ['line', sel.line], ['station', sel.station]]) {
                if (saved.get(key)) {
                    select.value = saved.get(key);
                    if (key === 'mode') fillLines();
                    if (key === 'line') fillStations();
                }
            }
            render();
            setInterval(refreshLive, LIVE_REFRESH_MS);
            setInterval(render, 60000);
        }

        function remember() {
            const params = new URLSearchParams({
                mode: sel.mode.value, line: sel.line.value, station: sel.station.value,
            });
            history.replaceState(null, '', '?' + params);
        }

        sel.mode.addEventListener('change', () => { fillLines(); remember(); });
        sel.line.addEventListener('change', () => { fillStations(); remember(); });
        sel.station.addEventListener('change', () => { render(); remember(); });
        sel.range.addEventListener('change', render);
        start();
    </script>
</body>

</html>
