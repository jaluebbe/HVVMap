<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>HVV Fahrten - Entwickleransicht</title>
    <style>
        :root {
            --ink: #1a2733;
            --muted: #5b6b78;
            --line: #d8dee3;
            --bg: #f4f6f8;
            --card: #ffffff;
            --accent: #1e64a0;
            --warn: #b3541e;
            --ok: #2b7a4b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
            font-size: 0.88rem;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 5;
            background: var(--card);
            border-bottom: 1px solid var(--line);
            padding: 12px 16px;
        }

        h1 {
            margin: 0 0 2px;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .meta {
            font-size: 0.78rem;
            color: var(--muted);
        }

        .meta-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            align-items: center;
            margin-top: 10px;
        }

        .toolbar input[type="search"],
        .toolbar select {
            padding: 6px 8px;
            border: 1px solid var(--line);
            border-radius: 6px;
            font: inherit;
        }

        .toolbar input[type="search"] {
            flex: 1 1 220px;
        }

        .toolbar input[type="search"].narrow {
            flex: 0 1 140px;
        }

        .tabs button {
            padding: 6px 12px;
            border: 1px solid var(--line);
            background: var(--bg);
            font: inherit;
            cursor: pointer;
        }

        .tabs button:first-child {
            border-radius: 6px 0 0 6px;
        }

        .tabs button:last-child {
            border-radius: 0 6px 6px 0;
            border-left: 0;
        }

        .tabs button.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        main {
            padding: 12px 16px 40px;
        }

        .summary {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .stat {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 4px 10px;
            white-space: nowrap;
        }

        .stat b {
            font-variant-numeric: tabular-nums;
            margin-right: 4px;
        }

        .stat span {
            color: var(--muted);
            font-size: 0.75rem;
        }

        /* narrow screens: scroll the table sideways, nothing sticky */
        @media (max-width: 900px) {
            .scroll {
                overflow-x: auto;
            }

            header,
            .trips > tbody > tr:first-child > th {
                position: static;
            }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card);
            border: 1px solid var(--line);
            font-variant-numeric: tabular-nums;
        }

        .trips > tbody > tr:first-child > th {
            position: sticky;
            top: var(--head-h, 0);
            z-index: 2;
        }

        tr.trip.open td {
            background: #e8f1f9;
            font-weight: 600;
        }

        .pill {
            display: inline-block;
            padding: 0 6px;
            border-radius: 8px;
            font-size: 0.76rem;
            white-space: nowrap;
        }

        .pill.ok {
            background: #e3f2e8;
        }

        .pill.warn {
            background: #fbe9e1;
        }

        .pill.muted {
            background: #eef1f4;
        }

        .late {
            color: var(--warn);
            font-weight: 600;
        }

        .ids {
            margin: 4px 0 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 16px;
        }

        th,
        td {
            text-align: left;
            padding: 5px 8px;
            border-bottom: 1px solid var(--line);
            vertical-align: top;
        }

        th {
            background: #eef1f4;
            font-weight: 600;
            font-size: 0.78rem;
        }

        tr.trip {
            cursor: pointer;
        }

        tr.trip:hover {
            background: #f0f6fb;
        }

        tr.detail td {
            background: #fafbfc;
            padding: 0 8px 8px 28px;
        }

        .ok {
            color: var(--ok);
        }

        .warn {
            color: var(--warn);
        }

        .muted {
            color: var(--muted);
        }

        .small {
            font-size: 0.8rem;
        }

        table.inner {
            border: 0;
            width: auto;
            min-width: 60%;
        }

        tr.detail table.inner td,
        tr.detail table.inner th {
            text-align: left;
            padding: 2px 10px 2px 0;
            border: 0;
            background: none;
        }

        .inner tr.expected td {
            font-weight: 600;
        }

        .inner td:nth-child(1),
        .inner th:nth-child(1) {
            min-width: 11em;
        }

        .inner td:nth-child(2),
        .inner th:nth-child(2),
        .inner td:nth-child(3),
        .inner th:nth-child(3) {
            min-width: 3.5em;
        }

        .inner td:nth-child(4),
        .inner th:nth-child(4) {
            min-width: 5.5em;
        }

        .inner td:nth-child(5),
        .inner th:nth-child(5) {
            min-width: 3em;
        }

        .inner tr.next td {
            background: #fff3c4;
            font-weight: 600;
        }

        .inner tr.next td:first-child::before {
            content: "▶ ";
        }

        .cols {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 32px;
            align-items: flex-start;
        }

        .detail h4 {
            margin: 6px 0 2px;
            font-size: 0.82rem;
        }

        .alias tr.shared td {
            color: var(--muted);
        }

        .interp {
            font-style: italic;
            color: var(--muted);
        }

        .badge {
            display: inline-block;
            padding: 0 6px;
            border-radius: 8px;
            font-size: 0.74rem;
            border: 1px solid currentColor;
        }

        .warning {
            background: #fde8e0;
            border: 1px solid var(--warn);
            color: var(--warn);
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 12px;
        }

        .err {
            color: var(--warn);
            padding: 16px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Fahrten: Plan gegen Echtzeit</h1>
        <div class="meta-row">
            <div class="meta" id="meta">lade …</div>
            <label><input type="checkbox" id="auto" checked> alle 30 s aktualisieren</label>
        </div>
        <div class="toolbar">
            <span class="tabs">
                <button data-tab="trips" class="active">Fahrten</button>
                <button data-tab="live_only" title="Live-Abfahrten mit Plan-serviceId ohne Plan-Partner">Nicht zugeordnet</button>
            </span>
            <select id="mode"></select>
            <select id="line"></select>
            <select id="dest"></select>
            <select id="status"></select>
            <input type="search" id="q" placeholder="Suche (Ziel, Haltestelle, ID) …">
            <input type="search" id="vehicle" class="narrow" placeholder="Fahrzeug …">
            <label><input type="checkbox" id="running"> nur laufende Fahrten (±<input type="number" id="buffer" value="5" min="0" max="60" style="width:3.2em"> min)</label>
        </div>
    </header>
    <main>
        <div id="warnings"></div>
        <div class="summary" id="summary"></div>
        <div id="content"></div>
    </main>
    <script>
        const ENDPOINT = '/api/hvv/live/trips.json';
        const REFRESH_MS = 30000;
        let data = null;
        let tab = 'trips';
        const open = new Set();
        let filtersRestored = false;

        const esc = s => String(s ?? '').replace(/[&<>"]/g,
            c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        // serviceId, vehicles and destination cells of a remembered live state.
        const earlierCells = e => `<td class="muted">${esc((e.service_ids || []).join(', '))}</td><td class="muted">${esc(e.vehicles || '')}</td><td></td>`;
        const delayText = d => d == null ? '' : (d === 0 ? '±0' : (d > 0 ? '+' : '−') + Math.round(Math.abs(d) / 60 * 10) / 10 + ' min');
        // Index of the first stop not yet reached (planned time + delay >= now),
        // -1 if the trip has ended, -2 if it has not started yet.
        function nextStopIndex(t, now) {
            const times = t.stops.map(s => {
                if (!s.at) return null;
                const delay = (s.match && s.match.delay != null) ? s.match.delay : (s.course_delay ?? 0);
                return new Date(s.at).getTime() + delay * 1000;
            });
            const known = times.filter(x => x != null);
            if (!known.length) return -2;
            if (now < Math.min(...known)) return -2;
            const index = times.findIndex(x => x != null && x >= now - 30000);
            return index;
        }

        const lineKey = l => parseInt(String(l).replace(/\D/g, ''), 10) || 0;

        async function load() {
            try {
                const res = await fetch(ENDPOINT);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                data = await res.json();
                if (!filtersRestored) { filtersRestored = true; restoreFilters(); }
                render();
            } catch (e) {
                document.getElementById('content').innerHTML =
                    `<div class="err">Fehler beim Laden: ${esc(e.message)}</div>`;
            }
        }

        function fillSelects() {
            const statusSel = document.getElementById('status');
            if (statusSel.options.length) return;
            const modes = [...new Set(data.trips.map(t => t.mode))].sort();
            document.getElementById('mode').innerHTML = '<option value="">Alle Verkehrsmittel</option>' +
                modes.map(m => `<option>${esc(m)}</option>`).join('');
            statusSel.innerHTML = '<option value="">Alle Status</option>' +
                '<option value="bestätigt">bestätigt</option>' +
                '<option value="nicht gesehen">nicht gesehen</option>' +
                '<option value="zwischen Ankern">zwischen Ankern</option>' +
                '<option value="ausgefallen">ausgefallen</option>' +
                '<option value="vermutlich ausgefallen">vermutlich ausgefallen</option>' +
                '<option value="geändert">Ziel geändert</option>' +
                '<option value="kursziel">Kurs-Ziel statt Ansage</option>' +
                '<option value="anker">Anker nicht im Verlauf</option>';
        }

        const byName = (a, b) => a.localeCompare(b, 'de', { numeric: true });

        // Replace the options of a filter, keeping the selection if still offered.
        function setOptions(id, allLabel, values) {
            const sel = document.getElementById(id);
            const html = `<option value="">${allLabel}</option>` +
                values.map(v => `<option>${esc(v)}</option>`).join('');
            if (sel.dataset.html === html) return;
            sel.dataset.html = html;
            const keep = sel.value;
            sel.innerHTML = html;
            sel.value = values.includes(keep) ? keep : '';
        }

        // Lines and destinations offered depend on the chosen mode (and line).
        function fillDependentSelects() {
            const mode = document.getElementById('mode').value;
            const inMode = data.trips.filter(t => !mode || t.mode === mode);
            const lines = new Set(inMode.map(t => t.line));
            if (!mode) Object.keys(data.summary.by_line || {}).forEach(l => lines.add(l));
            setOptions('line', 'Alle Linien', [...lines].sort(byName));
            const line = document.getElementById('line').value;
            const dests = inMode.filter(t => !line || t.line === line).map(t => t.destination);
            setOptions('dest', 'Alle Ziele', [...new Set(dests.filter(Boolean))].sort(byName));
        }

        // Dropdown selections survive a reload via the URL (mode cascades to line to dest).
        function restoreFilters() {
            const saved = new URLSearchParams(location.search);
            fillSelects();
            if (saved.get('mode')) document.getElementById('mode').value = saved.get('mode');
            fillDependentSelects();
            if (saved.get('line')) document.getElementById('line').value = saved.get('line');
            fillDependentSelects();
            if (saved.get('dest')) document.getElementById('dest').value = saved.get('dest');
            if (saved.get('status')) document.getElementById('status').value = saved.get('status');
        }

        function rememberFilters() {
            history.replaceState(null, '', '?' + new URLSearchParams({
                mode: document.getElementById('mode').value,
                line: document.getElementById('line').value,
                dest: document.getElementById('dest').value,
                status: document.getElementById('status').value,
            }));
        }

        function renderWarnings() {
            const warnings = [];
            const s = data.summary || {};
            if (data.trips.length && !data.trips.some(t => t.stops.some(x => 'at' in x))) {
                warnings.push('Die API liefert noch keine Zeitstempel (<code>at</code>) - ' +
                    'Markierung des nächsten Halts und Filter „laufende Fahrten“ gehen erst nach Update von trips.py.');
            }
            if (s.live_anchor) {
                const lagMin = Math.round((Date.now() - new Date(s.live_anchor.replace(' ', 'T')).getTime()) / 60000);
                if (Math.abs(lagMin) > 10) {
                    warnings.push(`Live-Anker ${esc(s.live_anchor)} weicht ${lagMin} min von der Browserzeit ab - ` +
                        'die Daten sind veraltet (Fetcher läuft nicht oder mit falscher Zeitzone) oder der Browser steht in einer anderen Zeitzone.');
                }
            }
            document.getElementById('warnings').innerHTML =
                warnings.map(w => `<div class="warning">${w}</div>`).join('');
        }

        function renderSummary() {
            const s = data.summary || {};
            const q = Object.entries(s.quality || {})
                .map(([k, v]) => `${esc(k)}: ${v}`).join(', ') || '–';
            const rate = s.live_total ? Math.round(100 * s.live_matched / s.live_total) : 0;
            const stat = (v, l, title) => `<div class="stat"${title ? ` title="${esc(title)}"` : ''}><b>${v}</b><span>${l}</span></div>`;
            document.getElementById('summary').innerHTML =
                stat(s.live_total ?? 0, 'Live-Abfahrten') +
                stat(`${s.live_matched ?? 0} (${rate} %)`, 'gepaart', 'einem Plan-Halt zugeordnet, Flügelzeilen eingeschlossen') +
                stat(s.live_unmatched ?? 0, 'Plan-ID ohne Zuordnung', 'Live-Abfahrt mit einer serviceId aus dem Plan, aber ohne Plan-Partner') +
                stat(s.trips ?? 0, 'Fahrten') +
                stat(data.trips.filter(t => t.live_only).length, 'nur live') +
                stat(s.confirmed ?? 0, 'bestätigt') +
                stat(s.not_seen ?? 0, 'nicht gesehen') +
                stat(s.between ?? 0, 'zwischen Ankern', 'laufend, kein Anker im Live-Fenster') +
                stat(s.cancelled ?? 0, 'ausgefallen') +
                stat(s.missing ?? 0, 'vermutlich ausgefallen', 'erwartet, nie gesehen') +
                stat(s.extra ?? 0, 'Zusatzfahrten') +
                stat(q, 'Zuordnung');
            document.getElementById('meta').textContent =
                `Live-Anker ${s.live_anchor || '?'} · Plan-Anker ${s.plan_anchor || '?'}` +
                (data.fetched_at ? ` · Live-Stand ${new Date(data.fetched_at * 1000).toLocaleTimeString('de-DE')}` : '');
        }

        const clock = iso => iso ? iso.slice(11, 16) : '';
        const failedAt = ts => ` <span class="warn">(kein Verlauf, Abruf ${new Date(ts * 1000).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })} ohne Ergebnis)</span>`;
        const asOf = ts => ts ? ` <span class="muted">(Stand ${new Date(ts * 1000).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })})</span>` : '';

        // Second course of a split train, shared part greyed out.
        function aliasTable(a) {
            const until = a.stops.findIndex(s => s.name === a.shared_until);
            const from = a.stops.findIndex(s => s.name === a.shared_from);
            const rows = a.stops.map((s, i) => {
                const delay = s.delay;
                const cls = (until >= 0 && i <= until) || (from >= 0 && i >= from) ? 'shared' : '';
                return `<tr class="${cls}"><td>${esc(s.name)}</td><td>${esc(clock(s.arr))}</td><td>${esc(clock(s.dep))}</td><td>${esc(delayText(delay))}</td><td>${esc(s.platform)}</td></tr>`;
            }).join('');
            const parts = [];
            if (a.shared_until) parts.push(`identisch bis ${esc(a.shared_until)}`);
            if (a.shared_from) parts.push(`identisch ab ${esc(a.shared_from)}`);
            const note = parts.join(', ') || 'nicht vergleichbar';
            return `<div class="alias"><h4>Live-serviceId ${esc(a.service_id)} → ${esc(a.destination)} <span class="muted">(${note})</span>${asOf(a.fetched_at)}${a.vehicles ? ' <span class="muted">· ' + esc(a.vehicles) + '</span>' : ''}</h4>` +
                `<table class="inner small"><tr><th>Halt</th><th>an</th><th>ab</th><th>Verspätung</th><th>Gleis</th></tr>${rows}</table></div>`;
        }

        const STATUS_CLASS = { 'bestätigt': 'ok', 'zwischen Ankern': 'muted', 'nicht gesehen': 'muted' };
        const LATE_SECONDS = 180;

        const delayCell = d => d == null ? '' :
            `<span class="${d >= LATE_SECONDS ? 'late' : (d > 0 ? '' : 'ok')}">${esc(delayText(d))}</span>`;

        // Vehicle numbers of a trip from all its sources (live, course, wing parts).
        const tripVehicles = t => [t.vehicles,
            ...t.stops.map(s => s.match ? s.match.vehicles : ''),
            ...(t.alias_courses || []).map(a => a.vehicles)].join(' ').toLowerCase();

        function destinationCell(t) {
            let html = esc(t.destination);
            if (t.destination_announced && t.destination_announced !== t.destination) {
                html += ` <span class="pill warn" title="Angekündigt: ${esc(t.destination_announced)} - nicht im Fahrtverlauf, die Karte zeigt das Kurs-Ziel">Kurs-Ziel</span>`;
            }
            if (t.destination_changed) html += ' <span class="pill warn" title="Live-Ziel weicht vom Plan ab">Ziel geändert</span>';
            if (t.live_only) html += ' <span class="pill muted">nur live</span>';
            if ((t.aliases || []).length) html += ' <span class="pill muted">Flügelzug</span>';
            return html;
        }

        function idLine(t) {
            const parts = [];
            parts.push(t.live_only ? 'nur live' : `Plan-ID <b>${esc(t.service_id)}</b>`);
            if ((t.primary_ids || []).length) parts.push(`Live-serviceId <b>${esc(t.primary_ids.join(', '))}</b>`);
            if ((t.aliases || []).length) parts.push(`Flügel-ID <b>${esc(t.aliases.map(a => a.service_id).join(', '))}</b>`);
            if (t.course_id) parts.push(`Verlauf von Live-serviceId <b>${esc(t.course_id)}</b>${t.course_failed ? failedAt(t.course_fetched_at) : asOf(t.course_fetched_at)}`);
            else parts.push('<span class="muted">kein Fahrtverlauf, Zeiten zwischen Ankern interpoliert</span>');
            if (t.destination_announced && t.destination_announced !== t.destination) {
                parts.push(`<span class="warn">angekündigt: ${esc(t.destination_announced)}</span>`);
            }
            if ((t.anchors_outside_course || []).length) {
                parts.push(`<span class="warn">Anker nicht im Verlauf: ${esc(t.anchors_outside_course.join(', '))}</span>`);
            }
            return `<div class="ids small">${parts.map(p => `<span>${p}</span>`).join('')}</div>`;
        }

        function tripRows(list) {
            return list.map(t => {
                const isOpen = open.has(t.id);
                const status = `<span class="pill ${STATUS_CLASS[t.status] || 'warn'}">${esc(t.status)}</span>`;
                const nextIdx = nextStopIndex(t, Date.now());
                const nextText = nextIdx >= 0 ? `${esc(t.stops[nextIdx].station)} <span class="muted">${esc(t.stops[nextIdx].planned)}</span>`
                    : (nextIdx === -1 ? '<span class="muted">Ziel erreicht</span>' : '<span class="muted">noch nicht gestartet</span>');
                const vehicleNote = t.vehicles_remembered ? ' <span class="muted" title="aus dem Gedächtnis, kein aktueller Treffer">(gemerkt)</span>'
                    : (t.vehicles_from_course ? ' <span class="muted" title="aus dem Fahrtverlauf (departureCourse), kein aktueller Live-Treffer">(Verlauf)</span>' : '');
                let html = `<tr class="trip${isOpen ? ' open' : ''}" data-id="${esc(t.id)}">
                    <td>${isOpen ? '▾' : '▸'} ${esc(t.start_time)} <span class="muted">${esc(t.start_station)}</span></td>
                    <td><b>${esc(t.line)}</b></td>
                    <td>${destinationCell(t)}</td><td>${nextText}</td><td>${status}</td>
                    <td>${delayCell(t.max_delay)}</td>
                    <td>${esc(t.vehicles)}${vehicleNote}</td></tr>`;
                if (isOpen) {
                    const stops = t.stops.map((s, idx) => {
                        const m = s.match;
                        const dep = s.interpolated
                            ? `<span class="interp" title="interpoliert zwischen zwei Ankerstationen">~${esc(s.dep)}</span>`
                            : esc(s.dep);
                        const wing = m && (m.aliases || []).length
                            ? ' <span class="muted">+ ' + esc(m.aliases.map(a => a.service_id).join(', ')) + '</span>' : '';
                        const cells = m
                            ? `<td class="ok">${esc(m.quality)}</td><td>${esc(m.service_id)}${wing}</td><td>${esc(m.vehicles)}</td><td>${esc(m.destination)}${m.destination_changed ? ' <span class="warn">≠ Plan</span>' : ''}</td>`
                            : s.cancelled_earlier
                            ? `<td class="late" title="früher live als ausgefallen gemeldet">ausgefallen (früher)</td>${earlierCells(s.earlier)}`
                            : s.confirmed_earlier
                            ? `<td class="ok" title="früher live gesehen, Verspätung ${esc(delayText(s.earlier.delay))}">bestätigt (früher)</td>${earlierCells(s.earlier)}`
                            : `<td class="${s.expected ? 'warn' : 'muted'}">${s.expected ? 'erwartet, nicht gesehen' : ''}</td><td></td><td></td><td></td>`;
                        return `<tr class="${s.expected ? 'expected' : ''} ${idx === nextIdx ? 'next' : ''}"><td>${esc(s.station)}</td><td>${esc(s.arr)}</td><td>${dep}</td><td>${s.cancelled || (m && m.cancelled) ? '<span class="late">ausgefallen</span>' : delayCell(s.delay)}</td><td>${esc(s.platform)}</td>${cells}</tr>`;
                    }).join('');
                    html += `<tr class="detail"><td colspan="7">${idLine(t)}<div class="cols"><div class="alias"><table class="inner small"><tr><th>Halt</th><th>an</th><th>ab</th><th>Verspätung</th><th>Gleis</th><th>Zuordnung</th><th>serviceId</th><th>Fahrzeuge</th><th>Live-Ziel</th></tr>${stops}</table></div>${(t.alias_courses || []).map(aliasTable).join('')}</div><div class="muted small">~ interpoliert zwischen Ankern · grau: gemeinsamer Abschnitt der Flügelteile</div></td></tr>`;
                }
                return html;
            }).join('');
        }

        function render() {
            fillSelects();
            renderSummary();
            renderWarnings();
            fillDependentSelects();
            const line = document.getElementById('line').value;
            const dest = document.getElementById('dest').value;
            const mode = document.getElementById('mode').value;
            const status = document.getElementById('status').value;
            const q = document.getElementById('q').value.trim().toLowerCase();
            const vehicle = document.getElementById('vehicle').value.trim().toLowerCase();
            const running = document.getElementById('running').checked;
            const buffer = Math.max(0, +document.getElementById('buffer').value || 0);
            const box = document.getElementById('content');

            if (tab === 'live_only') {
                const modeLines = new Set(data.trips.filter(t => t.mode === mode).map(t => t.line));
                const rows = data.live_only.filter(e =>
                    (!line || e.line === line) &&
                    (!mode || modeLines.has(e.line)) &&
                    (!dest || e.destination === dest) &&
                    (!q || [e.destination, e.station, e.service_id].join(' ').toLowerCase().includes(q)) &&
                    (!vehicle || (e.vehicles || '').toLowerCase().includes(vehicle)));
                box.innerHTML = `<div class="scroll"><table><tr><th>Plan</th><th>Linie</th><th>Halt</th><th>Ziel</th><th>Gleis</th><th>Verspätung</th><th>Fahrzeuge</th><th>Grund</th><th>serviceId</th></tr>` +
                    rows.map(e => `<tr><td>${esc(e.planned)}</td><td><b>${esc(e.line)}</b></td><td>${esc(e.station)}</td><td>${esc(e.destination)}</td><td>${esc(e.platform)}</td><td>${esc(delayText(e.delay))}</td><td>${esc(e.vehicles)}</td><td class="warn">${esc(e.reason)}</td><td class="muted">${esc(e.service_id)}</td></tr>`).join('') +
                    '</table></div>' + (rows.length ? '' : '<div class="err muted">Keine Einträge.</div>');
                return;
            }

            const rows = data.trips.filter(t => {
                if (line && t.line !== line) return false;
                if (mode && t.mode !== mode) return false;
                if (dest && t.destination !== dest) return false;
                if (running) {
                    const now = Date.now(), pad = buffer * 60000;
                    if (now < new Date(t.route_start).getTime() - pad ||
                        now > new Date(t.route_end).getTime() + pad) return false;
                }
                if (status === 'geändert') { if (!t.destination_changed) return false; }
                else if (status === 'kursziel') { if (!t.destination_announced || t.destination_announced === t.destination) return false; }
                else if (status === 'anker') { if (!(t.anchors_outside_course || []).length) return false; }
                else if (status && t.status !== status) return false;
                if (vehicle && !tripVehicles(t).includes(vehicle)) return false;
                if (!q) return true;
                const hay = [t.destination, t.destination_announced, t.service_id, t.live_ids.join(' '),
                    t.stops.map(s => s.station).join(' ')].join(' ').toLowerCase();
                return hay.includes(q);
            });
            box.innerHTML = `<div class="scroll"><table class="trips"><tr><th>Start (erster Anker)</th><th>Linie</th><th>Ziel</th><th>Nächster Halt</th><th>Status</th><th>Max. Verspätung</th><th>Fahrzeuge</th></tr>${tripRows(rows)}</table></div>` +
                (rows.length ? '' : '<div class="err muted">Keine Fahrten.</div>');
        }

        document.addEventListener('click', e => {
            const tr = e.target.closest('tr.trip');
            if (tr) {
                const id = tr.dataset.id;
                open.has(id) ? open.delete(id) : open.add(id);
                render();
            }
            const tabBtn = e.target.closest('.tabs button');
            if (tabBtn) {
                tab = tabBtn.dataset.tab;
                document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b === tabBtn));
                if (data) render();
            }
        });
        // keep the table header below the sticky page header
        const setHeadHeight = () => document.documentElement.style.setProperty(
            '--head-h', document.querySelector('header').offsetHeight + 'px');
        window.addEventListener('resize', setHeadHeight);
        setHeadHeight();
        ['mode', 'line', 'dest', 'status', 'q', 'vehicle', 'running', 'buffer'].forEach(id => document.getElementById(id).addEventListener('input', () => data && render()));
        ['mode', 'line', 'dest', 'status'].forEach(id => document.getElementById(id).addEventListener('input', rememberFilters));
        setInterval(() => document.getElementById('auto').checked && load(), REFRESH_MS);
        load();
    </script>
</body>

</html>
