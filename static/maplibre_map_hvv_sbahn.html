<!DOCTYPE html>
<html lang="de">

<head>
    <link rel="manifest" href="/static/manifest_hvv_sbahn.json">
    <link rel="apple-touch-icon" href="/static/hvv/icon-sbahn-180.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="S-Bahn">
    <meta name="theme-color" content="#1e64a0">
    <link rel="icon" href="/static/hvv/icons/s.svg" type="image/svg+xml">
    <title>S-Bahn Hamburg</title>
    <link rel="canonical" href="https://hamburg-transit.de/sbahn">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta charset="utf-8" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">

    <link rel="stylesheet" href="/static/maplibre-gl/maplibre-gl.css">

</head>

<body>
    <div id="map"></div>
    <script src="/static/maplibre-gl/maplibre-gl.js"></script>
</body>
<script>
    // Same line icons as the vehicle markers (see trip_positions.py).
    const geofoxIcon = (lineKey) =>
        `https://cloud.geofox.de/icon/line?height=16&lineKey=${lineKey}&fileFormat=SVG`;
    window.HVV_PAGE_CONFIG = {
        // Hamburg Hbf
        center: [10.006, 53.553],
        zoom: 11,
        modes: ['S'],
        sourceKeys: ['gtilive'],
        lineToggles: {
            S: [
                { key: 'S1', color: '#1a962b', icon: geofoxIcon('ZVU-DB:S1_ZVU-DB_SBHZVU') },
                { key: 'S2', color: '#b51143', icon: geofoxIcon('SBH:S2_SBH_SBAHNS') },
                { key: 'S3', color: '#622181', icon: geofoxIcon('SBH:S3_SBH_SBAHNS') },
                { key: 'S5', color: '#0089bb', icon: geofoxIcon('SBH:S5_SBH_SBAHNS') },
                { key: 'S7', color: '#cc7720', icon: geofoxIcon('SBH:S7_SBH_SBAHNS') },
            ],
        },
    };
</script>
<script src="/static/maplibre_map_hvv_base.js"></script>
<script>
    initHvvVehicleLayers('gtilive');
</script>

</html>
