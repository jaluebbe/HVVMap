<!DOCTYPE html>
<html lang="de">

<head>
    <link rel="apple-touch-icon" href="/static/hvv/icon-ubahn-180.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TS">
    <meta name="theme-color" content="#1e64a0">
    <link rel="icon" href="/static/hvv/icons/u.svg" type="image/svg+xml">
    <title>TS</title>
    <!-- internal page: keep out of search engines -->
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta charset="utf-8" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
    <link rel="stylesheet" href="/static/maplibre-gl/maplibre-gl.css">
    <link rel="stylesheet" href="/static/maplibre_map_hvv.css">
</head>

<body>
    <div id="map"></div>
    <script src="/static/maplibre-gl/maplibre-gl.js"></script>
</body>
<script>
    // Same line icons as the vehicle markers (see trip_positions.py).
    const geofoxIcon = (lineKey) =>
        `https://cloud.geofox.de/icon/line?height=16&lineKey=${lineKey}&fileFormat=SVG`;
    window.HVV_PAGE_CONFIG = {
        // Betriebshof Barmbek
        center: [10.036, 53.590],
        zoom: 12,
        modes: ['U'],
        // unit numbers exist only in GTI-Live
        sourceKeys: ['gtilive'],
        unitNumbers: true,
        unitSearch: true,
        unitHistory: true,
        destinationLabels: false,
        // GTI delivers real tracks for all U-Bahn lines
        straightToggle: false,
        // disruptions are on the main map; this page is about the vehicles
        disruptions: false,
        lineToggles: {
            U: [
                { key: 'U1', color: '#006ab3', icon: geofoxIcon('HHA-U:U1_HHA-U') },
                { key: 'U2', color: '#e2001a', icon: geofoxIcon('HHA-U:U2_HHA-U') },
                { key: 'U3', color: '#ffdd00', icon: geofoxIcon('HHA-U:U3_HHA-U') },
                { key: 'U4', color: '#0098a1', icon: geofoxIcon('HHA-U:U4_HHA-U') },
            ],
        },
    };
</script>
<script src="/static/maplibre_map_hvv_base.js"></script>
<script>
    initHvvVehicleLayers('gtilive');
</script>

</html>
